title: "Utku Gülgeç"
subtitle: "An engineering notebook"

description: "A personal engineering notebook documenting hands-on exploration, experiments, and design thinking pursued independently alongside professional work."

url: "https://utkugulgec.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: default
enable_darkmode: true
enable_copy_code_button: true

defaults:
  - scope:
      path: ""
    values:
      author_profile: true
      author:
  name: "Utku Gülgeç"
  avatar: "/assets/images/avatar.jpg"   # optional
  bio: "Software engineer · Engineering notebook · Learning by building"

  location: "Türkiye"

  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/utkugulgec"

    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/YOUR-LINKEDIN"

    - label: "CV"
      icon: "fas fa-file-pdf"
      url: "/assets/cv/Utku_Gulgec_CV.pdf"

plugins:
  - jekyll-include-cache

include:
  - _pages
